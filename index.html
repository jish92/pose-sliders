<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Pose sliders</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#14161a; --panel:rgba(20,22,26,.88); --fg:#eef0f3; --mut:#9aa1ab; --acc:#ff5d6c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #view { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; width:100%; height:100%; outline:none; }
  #hint { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:0; right:0; text-align:center; color:var(--mut); font-size:12.5px; pointer-events:none; text-shadow:0 1px 2px #000; transition:opacity .6s; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--mut); z-index:5; transition:opacity .4s; }
  #panel { position:fixed; left:0; right:0; bottom:0; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top-left-radius:18px; border-top-right-radius:18px; padding:6px 18px calc(env(safe-area-inset-bottom) + 12px); max-width:640px; margin:0 auto; box-shadow:0 -6px 30px rgba(0,0,0,.45); transition:transform .25s; }
  #panel.min { transform:translateY(calc(100% - 52px - env(safe-area-inset-bottom))); }
  #grab { display:flex; align-items:center; justify-content:space-between; height:46px; cursor:pointer; user-select:none; }
  #grab b { font-weight:600; letter-spacing:.2px; }
  #grab .bar { position:absolute; left:50%; top:6px; width:38px; height:4px; margin-left:-19px; border-radius:2px; background:#555b66; }
  .btns { display:flex; gap:8px; }
  button { background:#262a31; color:var(--fg); border:1px solid #343944; border-radius:999px; padding:7px 14px; font:inherit; font-size:13.5px; }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .row { padding:7px 0 5px; }
  .row .t { display:flex; justify-content:space-between; font-size:14.5px; margin-bottom:2px; }
  .row .t span:last-child { color:var(--mut); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:34px; margin:0; background:transparent; -webkit-appearance:none; appearance:none; touch-action:pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(to right,var(--acc) var(--p,0%),#3a3f49 var(--p,0%)); }
  input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:#3a3f49; }
  input[type=range]::-moz-range-progress { height:6px; border-radius:3px; background:var(--acc); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; margin-top:-10px; box-shadow:0 1px 6px rgba(0,0,0,.6); }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border:0; border-radius:50%; background:#fff; }
  .sub { color:var(--mut); font-size:11.5px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="hint">Swipe to rotate · pinch to zoom · two-finger drag to pan</div>
<div id="load">Loading model…</div>
<div id="panel">
  <div class="bar" id="barx" style="position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:#555b66"></div>
  <div id="grab"><b>Poses</b><div class="btns"><button id="run" class="on">Run: on</button><button id="reset">Reset</button></div></div>
  <div id="rows"></div>
</div>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="./app.js"></script>
</body>
</html>
